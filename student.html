<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student · Arundhati ERP</title><link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* ---- Student portal ---- */
  .st-hero { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  .st-hero .hero-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; position: relative; z-index: 1; }
  .st-hero .chip { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22); padding: 4px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }

  /* Attendance ring in the hero */
  .st-ring { --p: 0; --rc: #fff; position: relative; z-index: 1; width: 128px; height: 128px; border-radius: 50%; flex: none;
    background: radial-gradient(closest-side, transparent 72%, transparent 0),
      conic-gradient(var(--rc) calc(var(--p) * 1%), rgba(255,255,255,.22) 0);
    display: grid; place-items: center; }
  .st-ring::before { content: ''; position: absolute; inset: 11px; border-radius: 50%; background: rgba(255,255,255,.1); }
  .st-ring-in { position: relative; text-align: center; color: #fff; }
  .st-ring-in b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .st-ring-in small { display: block; margin-top: 4px; font-size: 10.5px; opacity: .85; font-weight: 600; }

  /* Student ID card */
  .idcard { position: relative; overflow: hidden; border-radius: 18px; padding: 20px; color: #fff;
    background: linear-gradient(135deg, #0369a1 0%, #0e7490 55%, #0f766e 100%); box-shadow: 0 14px 34px rgba(3,105,161,.3); }
  .idcard::after { content: ''; position: absolute; right: -50px; top: -60px; width: 190px; height: 190px; border-radius: 50%; background: rgba(255,255,255,.1); }
  .idcard::before { content: ''; position: absolute; left: -40px; bottom: -70px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .idcard-top { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
  .idcard-mark { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.2); display: grid; place-items: center; flex: none; }
  .idcard-inst b { display: block; font-size: 13px; line-height: 1.2; } .idcard-inst small { opacity: .8; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .idcard-body { display: flex; align-items: center; gap: 14px; margin: 18px 0 16px; position: relative; z-index: 1; }
  .idcard-body .avatar { border: 2px solid rgba(255,255,255,.5); box-shadow: 0 4px 12px rgba(0,0,0,.2); background: rgba(255,255,255,.18) !important; color: #fff !important; }
  .idcard-id h3 { font-size: 18px; margin: 0; line-height: 1.2; }
  .idcard-prog { display: inline-block; margin-top: 5px; font-size: 11.5px; font-weight: 700; background: rgba(255,255,255,.2); padding: 2px 10px; border-radius: 99px; }
  .idcard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; position: relative; z-index: 1; margin: 0; }
  .idcard-grid dt { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .75; font-weight: 700; }
  .idcard-grid dd { margin: 2px 0 0; font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .idcard-grid .trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .idcard-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.2); position: relative; z-index: 1; font-size: 10.5px; opacity: .85; }
  .idcard-barcode { height: 22px; width: 92px; background: repeating-linear-gradient(90deg, #fff 0 2px, transparent 2px 4px, #fff 4px 5px, transparent 5px 9px); opacity: .9; border-radius: 2px; }

  /* Coming soon placeholder */
  .soon { position: relative; overflow: hidden; text-align: center; padding: 56px 28px; }
  .soon::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% -10%, var(--primary-soft), transparent 60%); opacity: .7; pointer-events: none; }
  .soon-ic { position: relative; width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 24px; display: grid; place-items: center; color: var(--primary);
    background: var(--primary-soft); box-shadow: 0 10px 30px color-mix(in srgb, var(--primary) 22%, transparent); animation: soon-float 3s ease-in-out infinite; }
  @keyframes soon-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .soon-badge { position: relative; display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    color: var(--primary); background: var(--primary-soft); padding: 6px 13px; border-radius: 99px; margin-bottom: 16px; }
  .soon-badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); animation: soon-pulse 1.4s ease-in-out infinite; }
  @keyframes soon-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }
  .soon h2 { position: relative; font-size: 24px; letter-spacing: -.02em; margin: 0 0 8px; }
  .soon p { position: relative; color: var(--muted); max-width: 440px; margin: 0 auto 26px; line-height: 1.55; }
  .soon-feats { position: relative; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); max-width: 620px; margin: 0 auto; text-align: left; }
  .soon-feat { display: flex; gap: 11px; align-items: flex-start; padding: 14px 15px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .soon-feat .sf-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--primary); flex: none; }
  .soon-feat b { display: block; font-size: 13.5px; } .soon-feat small { color: var(--muted); font-size: 12px; line-height: 1.4; }

  /* Calendar extras (shared with faculty view) */
  .cal-wrap { position: relative; }
  .cal-d.sun { background: repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 5px, transparent 5px, transparent 10px); color: var(--muted); opacity: .8; }
  .cal-d.future { background: transparent; border: 1px dashed var(--border); color: var(--muted); }
  .cal-d.none { background: var(--surface-2); }
  .cal-d[data-tip]:hover::after {
    content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--surface); font-size: 11.5px; font-weight: 600; line-height: 1.4; white-space: pre;
    padding: 7px 10px; border-radius: 8px; z-index: 10; pointer-events: none; box-shadow: var(--shadow); animation: pop .12s ease-out; text-align: left; }
  .cal-d.tip-l[data-tip]:hover::after { left: 0; transform: none; }
  .cal-d.tip-r[data-tip]:hover::after { left: auto; right: 0; transform: none; }
  .cal-mini { gap: 4px; }
  .cal-mini .cal-d { border-radius: 7px; font-size: 12px; }
  .cal-mini .cal-d:hover { transform: scale(1.1); z-index: 2; }
  .cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 14px; }
  .cal-legend span { display: inline-flex; gap: 6px; align-items: center; }
  .cal-legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

  .month-nav { display: flex; gap: 8px; align-items: center; }
  .month-nav select { width: auto; padding: 8px 12px; font-weight: 600; }
  .month-nav .icon-btn:disabled { opacity: .4; cursor: not-allowed; }

  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; font-weight: 500; animation: fade .25s ease-out; }
  .banner-bad { background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 25%, transparent); }
  .banner-info { background: var(--info-soft); color: var(--info); border: 1px solid color-mix(in srgb, var(--info) 20%, transparent); }
  .banner b { display: block; }

  .pct-big { font-size: 40px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .pct-block { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }

  .list { display: flex; flex-direction: column; }
  .list-item { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 6px; border-top: 1px solid var(--border); border-radius: 8px; transition: background .15s; }
  .list-item:first-child { border-top: 0; }
  .list-item p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .ann-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }

  .tabs button { transition: background .15s, color .15s; }
  .tabs button:hover:not(.active) { color: var(--text); }

  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 10px 16px; font-size: 13.5px; margin: 0; }
  .kv dt { color: var(--muted); font-weight: 600; }
  .kv dd { margin: 0; font-weight: 500; }

  .form-error { display: flex; gap: 8px; align-items: center; background: var(--bad-soft); color: var(--bad); padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 13.5px; margin-bottom: 14px; animation: shake .35s; }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .field.err input { border-color: var(--bad); }

  .pw-strength { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: -6px 0 14px; }
  .pw-strength div { height: 100%; width: 0; transition: width .3s, background .3s; }
  .pw-wrap { position: relative; }
  .pw-wrap button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; }

  @media (max-width: 860px) {
    .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 10px; }
    .st-ring { margin: 0 auto; }
  }
  @media (max-width: 480px) { .cal { gap: 3px; } .cal-d { border-radius: 7px; font-size: 12px; } .cal-d small { font-size: 9px; } .idcard-grid { grid-template-columns: 1fr; } }
</style>
</head><body><script src="js/employees.js"></script><script src="js/attendance-seed.js"></script><script src="js/students.js"></script><script src="js/data.js"></script><script src="js/ui.js"></script><script src="js/student.js"></script></body></html>
