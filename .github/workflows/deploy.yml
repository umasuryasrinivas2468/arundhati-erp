# Push to main -> production deploy of campushub.aims.ac.in (Vercel project arundhati-erp).
# Needs repo secret VERCEL_TOKEN (vercel.com/account/tokens, scoped to the tribhuvans-projects team).
name: Deploy to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: production
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_KrQ1Pi7H93acDrq1MYTiIdJR
      VERCEL_PROJECT_ID: prj_Rgz0513PdEt0mkvz5ekWgq5iTuDg
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
