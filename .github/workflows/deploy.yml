name: Deploy main to EC2

# Every push to main builds the Next.js app in web/ and deploys it to
# campushub.aims.ac.in (EC2, systemd running `next start` behind Caddy).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing (never cancel mid-deploy).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_DIR: /opt/arundhati-erp
      SITE_URL: https://campushub.aims.ac.in
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Gate: a commit that doesn't build never reaches the server.
      - name: Build check
        run: |
          cd web
          npm ci
          npm run build

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n  ConnectTimeout 10\n' "$HOST" "$USER" > ~/.ssh/config

      - name: Deploy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          prev="$(ssh prod "cd '$APP_DIR' && sudo git rev-parse HEAD")"
          echo "PREV_SHA=$prev" >> "$GITHUB_ENV"
          echo "Live: $prev -> deploying $GITHUB_SHA"
          ssh prod "APP_DIR='$APP_DIR' SHA='$GITHUB_SHA' SUPABASE_URL='$SUPABASE_URL' SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY' bash -s" <<'REMOTE'
            set -euo pipefail
            cd "$APP_DIR"
            sudo git fetch -q origin main
            sudo git reset -q --hard "$SHA"
            sudo git log -1 --oneline
            # release.sh (re)writes the systemd unit + Supabase env, builds web/, restarts.
            sudo env APP="$APP_DIR" \
              SUPABASE_URL="$SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
              bash "$APP_DIR/deploy/release.sh"
          REMOTE

      # The app must answer with {"ok":true} (Supabase reachable) through Caddy; otherwise roll back.
      - name: Health check (rolls back on failure)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for i in $(seq 1 18); do
            body="$(curl -s -m 10 "$SITE_URL/api/db" || true)"
            echo "attempt $i: ${body:0:80}"
            case "$body" in *'"ok":true'*) exit 0;; esac
            sleep 5
          done
          echo "::error::New version not serving {ok:true}, rolling back to $PREV_SHA"
          ssh prod "APP_DIR='$APP_DIR' PREV='$PREV_SHA' SUPABASE_URL='$SUPABASE_URL' SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY' bash -s" <<'REMOTE'
            set -euo pipefail
            cd "$APP_DIR"
            sudo git reset -q --hard "$PREV"
            sudo env APP="$APP_DIR" \
              SUPABASE_URL="$SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
              bash "$APP_DIR/deploy/release.sh"
          REMOTE
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy
